services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    profiles:
      - litellm

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicentral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicentral}
      POSTGRES_DB: ${POSTGRES_DB:-aicentral}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicentral}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
